services:
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: eventbook
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3333:3333"
    command: sh -c "npx prisma migrate deploy && npm run db:seed && npm run start"
    environment:
      PORT: 3333
      NODE_ENV: production
      DATABASE_URL: mysql://root:root@mysql:3306/eventbook
      JWT_SECRET: ${JWT_SECRET:-segredo_docker}
      SEED_PASSWORD: ${SEED_PASSWORD:-senha_docker}
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
